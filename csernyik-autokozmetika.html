       (21 years, "thousands of satisfied customers"), akkreditált Gtechniq
       műhely + webshop, only passenger cars/city SUVs, typically a ~1 month

       line items rather than guessed from scratch (2nd demo in the gallery
       after Kertkozmetika to do this): standard kül-beltéri 14–18k,
       standard+viaszolás 32–52k, beltér mélytisztítás 50–60k, korrekciós
       polírozás 80–160k, Gtechniq kerámia bevonat 180–260k.

       construction/plumbing/roofing/HVAC/landscaping trade, so this is a
       new vertical. Scenario leans on their actual accreditation: a
       3-year-old car with swirl marks from automatic car washes, wanting
       long-term ceramic protection — the agent explains why correction
       polishing has to happen BEFORE ceramic coating (coating seals in
       whatever's already on the paint), which is genuine domain expertise
       specific to this trade, not something a generic "car cleaning" bot
       would know to mention. Also folds in wheel coating and an interior
       clean as real upsells from their own service list, and mentions the
       real ~1-month booking wait as a distinct fact from the job's own
       turnaround time (3–4 days of actual work).
       Logo `csernyik-autokozmetika-logo.jpg` — vivid violet background,
       white water-drop + car-silhouette mark; sampled by pixel (#7013f7).
       THEME leans hard into that exact violet — first purple-based palette
       in the gallery.
       Data-only file: the engine + styles live in /quote-agent.js + /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
