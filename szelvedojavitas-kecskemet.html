       actual formula, not just a band: kőfelverődés javítás from 17,500 Ft,
       repedésjavítás from 20,000 Ft PLUS 500 Ft per centimeter of crack
       length. First demo in the gallery built around a literal computable
       pricing formula rather than a qualitative estimate, the scenario
       uses a 12 cm crack and the agent walks through the exact math
       (20,000 + 12 x 500 = 26,000) live in the dialogue, real domain
       precision no other demo has shown.
       Fifth windscreen-adjacent demo in the gallery (after Glass Mechanix
       Dombóvár, Autóüveg Debrecen, Autóüveg Centrum Debrecen, Glass Master
       Győr), differentiated by the exact pricing formula and by the named
       multi-location pickup choice (Auchan / Kis Tesco / Nagy Tesco
       parkoló) instead of the usual simple mobile-vs-workshop binary.
       Logo is a plain black line-art windscreen icon on white, no colour
       to sample at all (same situation as Szakszig, Kozák, Házrehab).
       THEME is a fresh thematic pick, not pixel-sampled: lime green on
       dark charcoal, an "efficiency/speed" palette matching the real
       15-minute completion claim, and a hue nothing else in the gallery
       uses as its primary brand colour, deliberately not another blue
       given how saturated blue already is across the other four
       windscreen demos.
       Dialogue written short, without em dashes, per Milan's standing
       preference.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
