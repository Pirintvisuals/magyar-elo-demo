  <title>Instant Quote Demo</title>
  <!-- Client sample. Szélvédő javítás Dunaújváros. Owner Rasztovits Ottó,
       found via web search since no site was given, only a photo of the
       physical roadside banner and a phone number: nearly 30 years doing
       windscreen repair and 15 years doing headlight polishing, based at
       the Tesco parking lot in Dunaújváros (2400), phone +36 70 635 4652.
       No fixed price list exists, real detail confirmed by search results,
       pricing depends on damage severity/size/position and is quoted after
       an on-site look, unlike Kecskemét's exact formula or Dombóvár's
       published band, so the dialogue never states a number until the
       usual end-of-flow budget question, consistent with how every
       non-formula demo in the gallery handles it.
       Sixth windscreen-adjacent demo in the gallery. Needed real
       differentiation from the two solo demos already covering similar
       ground: Glass Master Győr leads with headlight polishing (12+
       years) and folds in scratch repair as a secondary beat; this one
       leads with the owner's actual PRIMARY specialty, windscreen chip and
       crack repair (his ~30 years vs 15 years on lamps), and uses a star-
       shaped break (csillag alakú kőfelverődés) rather than the simple
       round chip or long crack every other demo has already used, plus
       the real detail that the resin restores the glass's structural
       integrity, not just its appearance. Kept it to windscreen repair
       only rather than also folding in lamp polishing, since Győr already
       covers that combo and repeating it here would read as a reskin.
       Logo is a photo of a real weathered roadside banner (not a clean
       vector mark), so its colours are muted by actual outdoor lighting:
       brick red and dusty mustard yellow rather than vivid tones, sampled
       by pixel (red #aa4044, mustard #b8a13b). Two other demos already use
       vivid red (Tetőfedés Szaki, Glass Mechanix Dombóvár), so THEME leads
       with the mustard yellow instead on a warm dark brown-black base,
       avoiding a third red and reading as an aged, hand-painted sign
       rather than a clean digital brand, distinct from Gáz-Lak's more
       saturated golden-excavator yellow too.
       Solo operator, so the agent speaks in first person singular
       throughout (fecskendezek, dolgozom, érlek el), same treatment as
       Csergő Szabolcs, Glass Mechanix Dombóvár and Glass Master Győr.
       Dialogue written short, without em dashes, per Milan's standing
       preference.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>
