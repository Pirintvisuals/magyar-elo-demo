  <!-- Client sample · Kozák tetőfedő mester (registered as Kozák Hausmeister
       Bt. per their site footer) · Budapest, operating nationwide. Real site
       (tetofelujitasbp.hu) is unusually detailed: 2-generation family
       business, ács+tetőfedő+bádogos mester, 30 years, contact Mihály Gábor.
       Angle: this is the THIRD roofing demo in the gallery, so it needed a
       genuinely different job shape from Keszthelyi Tető (pitched eternit→
       tile, full teardown) and Tetőfedés Szaki (flat garage roof, bitumen→
       EPDM). Their site explicitly sells "palatető felújítása
       cserepeslemezzel" — old slate-effect asbestos-cement sheet roofing
       overlaid with lightweight metal tile-effect sheet, EXPLICITLY WITHOUT
       removing the old roof ("tetőfedés bontás nélkül") — a real, distinct
       technique (overlay vs teardown) that's the whole point of the
       conversation here.
       Logo `kozak-tetofedo-logo.jpg` — circular white badge with a "K"
       monogram on a teal-to-cyan diagonal gradient background, sent by the
       client after the demo first went out (it originally shipped with the
       engine's letter-badge fallback since no logo was supplied yet).
       Colours sampled by pixel from the gradient (#205c74 → #3aacce).
       Client is in Gödöllő (~28 km from Budapest) rather than same-city, to
       reflect their actually-nationwide/regional reach rather than a single
       town's local radius like most other demos.
       Data-only file: the engine + styles live in /quote-agent.js + /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>
