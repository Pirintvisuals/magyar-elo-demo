  <!-- Client sample. Matt-Rex Kft. (brand "Matthias Rex"), Iparos u. 42.,
       Érd 2030, phone +36 30 557 0056, email szelvedojavitas@m-rex.hu.
       This prospect caught Milan repeating a stock "nincs weboldala" line
       he hadn't actually verified, and he owned the mistake rather than
       inventing a cover story, per Milan's standing "never fabricate a
       justification" rule. Built this demo off real detail afterward:
       their customer-facing site szelvedojavitas-erd.hu (premium auto
       glass service since 2020, 5000+ repairs, 243+ five-star Google
       reviews, up to 5 year repair warranty, XPEL stone-protection film,
       nano impregnation, headlight polishing, tinting, fleet discounts,
       tagline "Látni és látszani!", mobile dispatch "akár aznap"), plus
       their separate wholesale/training site m-rex.hu (official Delta
       Kits distributor, "szakemberektől, szakembereknek"). Wide real
       service area given directly by the prospect: Érd, Tárnok, Diósd,
       Pusztazámor, Biatorbágy, Törökbálint, Sóskút, Budaörs,
       Százhalombatta.
       Eleventh windscreen-family demo in the gallery, so needed a job
       shape none of the ten prior ones use. This is the first to lean on
       PREVENTION rather than just repair: alongside a small chip repair,
       the customer adds XPEL stone-protection film across the whole
       windscreen so future stone hits don't crack it at all, using their
       own real XPEL offering rather than inventing an upsell. No other
       glass demo in the gallery sells protective film. Cited the real
       5000+ repairs / 243 reviews stat as the trust beat instead of a
       generic years-in-business line, since that is what their own site
       actually leads with.
       Logo is a black shield crest with a car silhouette and "MATTHIAS
       REX" in champagne gold, sampled by pixel (bg near-black #000000,
       gold #c9a769, highlight #e0c98d). Kozák tetőfedő mester already
       uses navy-and-gold, but on a navy-tinted charcoal base; this one is
       true black, matching the logo exactly, which keeps the two
       readable as different demos rather than a near-duplicate.
       Established Kft with multiple workshops (Budapest, Érd, Diósd per
       their own text), so the agent speaks first person plural throughout
       (vállaljuk, kijövünk).
       Dialogue written short, without em dashes, per Milan's standing
       preference.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
