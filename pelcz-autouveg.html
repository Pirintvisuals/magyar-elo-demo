  <title>Instant Quote Demo</title>
  <!-- Client sample. Pelcz Autóüveg Kft., Diósi út 14., Pécs 7630.
       Real detail pulled from their own site pelczautouveg.hu, not just the
       lead sheet: 30 years in business, their own tagline "Szélvédő gondja
       megoldva!", the promise "minőségi szolgáltatás, gyári technológia,
       ügyfélbarát megoldások", 10 year warranty on chip repairs, official
       casco kárfelvevő hely for eleven named insurers (K&H, Gránit, Allianz,
       Generali, Alfa, Signal Iduna, Groupama, Uniqa, Union, Köbe, Porsche),
       4,8 csillag / 205 Google értékelés, and the service line that matters
       most here: they do TRUCK windscreens and mirror replacement, not just
       passenger cars. Phone (72) 516-850 / 06 70 256 5660,
       info@pelczautouveg.hu.
       Seventh windscreen demo in the gallery, so the job shape had to be
       genuinely new rather than a reskin. Every prior one is a passenger
       car: Kecskemét and Dombóvár and Dunaújváros do chip/crack resin
       repair, Győr leads with headlight polishing, Autóüveg Debrecen does a
       casco-funded car windscreen swap, Autóüveg Centrum Debrecen does a
       self-funded aftermarket car windscreen swap. This one is a
       HASZONGÉPJÁRMŰ job, a 2018 MAN TGL 12.220 with a 60 cm crack, plus a
       mirror glass swap on the same visit. That is the first commercial
       vehicle in either gallery and it changes the customer's actual pain
       from cosmetics to downtime, which is the "sell time back" beat.
       Deliberately made him DECLINE the casco route (glass önrész plus
       bonus loss is not worth it on a work truck, a real haulier's
       reasoning) so the itemised quote is real glass plus labour rather
       than a repeat of Autóüveg Debrecen's önrész estimate. Their casco
       credential still lands, because the agent offers it and names the
       eleven-insurer claims centre before he turns it down.
       The 10 year warranty is stated only where it is true, on chip repair,
       and this is a replacement, so the agent cites the 30 years and the
       gyári technológia instead. Nothing about ADAS calibration is claimed,
       their site does not mention it.
       Logo is a flat sky-blue square with a white glass mark, sampled by
       pixel: bg #38a8f2, wordmark navy #204c73, mark highlight #a1d7fd.
       Two Debrecen demos already sit in blue (#008dd2 and #01a0e2) on
       near-neutral dark bases, so THEME keeps the brand-true lighter sky
       blue but puts it on the logo's OWN deep navy rather than a neutral
       charcoal, which reads as a distinctly cooler, bluer demo next to
       those two instead of a third grey-and-blue near-duplicate.
       Company with staff, so the agent speaks first person plural
       (cserélünk, kiadjuk, csináljuk), unlike the solo-operator demos.
       Dialogue written short, without em dashes, per Milan's standing
       preference.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>

<div class="page-center" id="hero"></div>
