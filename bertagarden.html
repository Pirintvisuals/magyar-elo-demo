<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>Instant Quote Demo</title>
  <!-- Client sample. BertaGarden (BERTA-GARDEN Kft.), Szeged, serving
       Bács-Kiskun, Békés and Csongrád-Csanád counties too. Real site copy
       (bertagarden.hu): 10+ years experience, free site survey, a
       published 7-step öntözőrendszer install process (survey, design
       plan with costs/timeline, trenching, water-source connection,
       electric valve/zone assembly, backfill+programming, handover with
       usage training), warranty on every complete system they design,
       typical install 1-2 days for a normal garden. Real technical USPs
       used as the expertise beats: WiFi/app control, a rain sensor that
       skips watering after real rain, early-morning timing to cut summer
       evaporation loss by "up to 50%" (their own stated figure), and
       rainwater-harvesting/cistern integration as an alternative water
       source to mains or a well.
       Requested specifically as an "öntözőrendszer kalkulátor" (irrigation
       calculator), not a general garden build, so unlike Kertkozmetika
       (full from-scratch garden, sod+patio+irrigation+hedge as one of
       several line items) this demo goes deep on irrigation alone: an
       EXISTING garden getting a system retrofitted (well as the water
       source, a real option their own site lists alongside mains/cistern),
       not a new-build plot, and every real USP above gets its own beat in
       the dialogue instead of being one bullet among many.
       Logo file supplied was `bertagarden-logo-feher.svg`, a white-fill
       wordmark ("feher" = white), meant for a dark surface. The engine's
       logo-wrap has a solid white background (quote-agent.css), so a
       white-on-white mark would be invisible. Made a visible copy
       (`bertagarden-logo.svg`) with the fill swapped to their real sampled
       brand colour instead of inventing a new one: #4a543d, read directly
       off the live site's own CTA button background via computed style,
       not guessed.
       Colour note: that olive green sampled almost exactly the same hue
       and lightness as Házrehab Bau's existing palette (#3d4a2a/#5c6e3a).
       Rather than force a different green that wouldn't match their real
       brand, THEME keeps the real olive for the base/majority tones but
       adds a genuine differentiator Házrehab's palette doesn't have: a
       water-blue accent (#5ec2d6) used specifically for the pulse dot and
       the focus ring, a deliberate "irrigation" cue neither present nor
       thematically appropriate in Házrehab's exterior-insulation demo.
       Dialogue written short, without em dashes, per Milan's standing
       preference.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>

<div class="page-center" id="hero"></div>
