       festés. 15 év tapasztalat, garancia minden munkára, ingyenes helyszíni
       felmérés, saját szakembergárda (vízszerelő, villanyszerelő, burkoló,
       festő egy csapatban). Slogan sampled verbatim from their own copy:
       "gyors és minőségi munkát, korrekt, piaci áron".
       Angle: their own fürdőszoba-felújítás page brags about turnaround —
       "a kis panel fürdőszobákat pár napon belül újítjuk fel bontástól az
       átadásig" — so this demo is a small PANEL bathroom full gut reno

       szintbeni zuhanyzó), leaning on the in-house multi-trade team as the
       reason they can move that fast without subcontractor handoffs. This
       differs from Fintor's emergency drain call-out (tiny/urgent) and
       Inverto's whole-flat panel gut reno (much bigger scope) — same broad
       "wet room" family, different job shape from both.
       Logo `banacraft-logo.png` — white bg, navy house-outline mark + navy
       "CRAFT" wordmark + green "BANA" wordmark, sampled by pixel (navy
       #213267, green #3eba81). THEME built as a dark navy palette with the
       green as the primary accent — first navy+green combo in the gallery.
       Client and company both in Budapest (X. kerület → XIV. kerület,
       Zugló), short in-city distance rather than inter-city.
       Data-only file: the engine + styles live in /quote-agent.js + /quote-agent.css. -->
