<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>Instant Quote Demo</title>
  <!-- Client sample. Csergő Szabolcs. Solo háztartásigép-szerelő, Várpalota
       (Bezerédi utca 26, Veszprém megye). Note: Milan's message named this
       prospect "gergo szabolcs" but the logo itself reads "Csergő
       Szabolcs", confirmed by a real regionaliskiado.hu directory listing
       for the same trade and town, so the file, brand name and dialogue all
       use the corrected name.
       A one-person business, not a Kft, so unlike every other demo in the
       gallery the agent speaks in first person singular throughout (kimegyek,
       megnézem, érlek el) rather than the usual "mi/nálunk" plural a
       company would use. Real facts are thin here, just the FB bio Milan
       pasted ("Háztartásigépek javítása, alkatrészek") plus the one
       directory listing, so the copy stays factual rather than inventing
       years of experience or credentials that aren't confirmed anywhere,
       same approach as the Zaha Zaha demo.
       Second appliance repair demo in the gallery after Sugár Szerviz, so
       needed real differentiation: a different appliance (fridge, not a
       washing machine), a different fault (thermostat/relay, not a drain
       pump), and it leans on the "alkatrészek" half of this prospect's own
       bio that Sugár Szerviz's copy never mentioned. The customer
       considered ordering the part themselves and fitting it, and the
       agent's pitch is specifically about the risk of guessing the wrong
       part versus an on-site diagnosis paired with the correct part and a
       warranty on the install, a genuine solo-tradesman-with-parts-stock
       angle. Client placed in Berhida, a real small neighbouring town
       about 6 km from Várpalota, rather than the same town, since a solo
       repairer plausibly covers a tight local radius rather than a whole
       county.
       Logo `csergo-szabolcs-logo.jpg`: white background, black wordmark,
       a soft periwinkle recycling-arrows icon, sampled by pixel (icon
       #9bbaf0). THEME pairs a near-black navy base with that exact
       periwinkle as the accent, distinct from Fintor's vivid cyan-blue and
       Aqua System's grey-blue, both more saturated and cooler.
       Dialogue written short, without em dashes, per Milan's standing
       preference.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>
<body>
<div class="page-center" id="hero"></div>
<div id="widget-root"></div>
