  <!-- Client sample. Zilahi Autoglas, Százados út 2., Szolnok 5000.
       Phone (56) 423 000, email zilahiautoglas@gmail.com, site
       zilahiautoglas.hu. Real detail pulled from their own site: founded
       1993 (30+ years), full range beyond just glass, autóüveg csere,
       szélvédőjavítás, autófesték keverés (custom paint mixing),
       fényszóró felújítás, karosszéria javítás és fényezés, and
       biztosítói kárfelmérés on-site. Own philosophy line "szakértelem,
       megbízhatóság és ügyfélközpontúság" and tagline "az Ön autója a
       legjobb kezekben van" used for the hero sub/tagline.
       Tenth windscreen demo in the gallery, so needed a genuinely new job
       shape, not another single-focus glass job. This is the first demo
       to use the shop's real cross-trade range: a windscreen replacement
       plus an in-house paint touch-up on the same visit (a door-edge chip
       from the same stone-hit), using their own autófesték keverés to
       colour-match rather than sending the customer to a separate body
       shop. That is a genuinely different value prop from every prior
       glass demo, all of which are glass-only businesses. Kept it
       self-pay/cash rather than a third casco storyline (Debrecen and
       Sárospatak already run casco-funded jobs, Pelcz runs a declined
       one), even though this shop's own site does mention insurance
       claim support.
       The file the user supplied ("zilahi autoglass.jpg" / "zilahi
       autoglass logo.jpg") is not a clean logo mark, it is a full
       flyer/business-card scan with a cartoon mascot and dense text, same
       situation as Gáz-Lak Mester's excavator photo. Flagged this; Milan
       chose to use it as-is anyway (same call he made on Gáz-Lak), so it's
       wired in as logoSrc rather than the letter-badge fallback.
       THEME approximates the flyer's own red-and-navy scheme by eye (not
       precisely pixel-sampled, the source is a busy low-res scan) on a
       navy-black base, a combination not yet used in the gallery, Dombóvár
       and Tetőfedés Szaki are both red-on-neutral-black, neither is navy.
       Established company with staff since 1993, so the agent speaks
       first person plural throughout (vállaljuk, festünk).
       Dialogue written short, without em dashes, per Milan's standing
       preference.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>
