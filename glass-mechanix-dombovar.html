  <!-- Client sample. Glass Mechanix Dombóvár Partner (real local business
       name is "Szélvédő Javítás Dombóvár", owner Máté Valentin), a local
       licensed operator of the Glass Mechanix windscreen repair technology.
       Real site copy (szelvedojavitasdombovar.hu): 7200 Dombóvár, Kórház
       utca 55, workshop in the Lidl parking lot, free mobile callout to
       Dombóvár and surrounding settlements at the same price as the
       workshop, completed in max 30 minutes, real published price band
       5,000-15,000 Ft depending on damage TYPE not size, lifetime warranty
       ("élettartam garancia"), open daily 7-20h. Line items built inside
       their real published band rather than guessed from scratch.
       Solo operator, not a Kft, so the agent speaks in first person
       singular throughout (kimegyek, garanciát adok, a műhelyem), same
       approach as the Csergő Szabolcs demo.
       First windscreen/auto-glass demo in the gallery, and a genuinely
       different automotive job shape from Csernyik Autókozmetika (cosmetic
       detailing, days of work) despite both being car-trade demos: this is
       a quick 30-minute structural safety repair. Scenario leans on real
       expertise a technician would actually have: not every chip is
       repairable, damage directly in the driver's primary sightline or
       past a certain crack length often needs replacement instead of
       repair because of leftover optical distortion, a genuine
       differentiator beat the same way Csernyik's correction-before-coating
       explanation was.
       Logo `glass-mechanix-dombovar-logo.png`. white background, vivid red
       wordmark and circular car+wrench icon, black "DOMBÓVÁR PARTNER"
       subtext, sampled by pixel (#db0000). THEME deliberately differs from
       Tetőfedés Szaki's red palette, that one washes the whole dark base in
       brick maroon (#100809/#2b0d0f/#5c1418), this one keeps bg/dark/mid
       true neutral black/charcoal and uses the red only as a sharp accent,
       a black-and-red racing-stripe read rather than an all-over maroon one.
       Dialogue written short, without em dashes, per Milan's standing
       preference.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>
