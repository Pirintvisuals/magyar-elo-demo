  <!-- Client sample. JoeandGlass, Jászai Mari utca 25., Szombathely 9700.
       Phone (30) 721 9772, email sziberzsolt2018@gmail.com. Lead came in as
       a bare contact card, no FB About text, no working site (fix24.hu
       listing 522'd, joszaki.hu and qjob.hu had no listing under this
       name), and no logo file. Kept the demo to what's actually
       verifiable: name, address, phone, email, and that this is a
       windscreen chip/crack repair business in Szombathely. Deliberately
       did NOT put a specific years-of-experience number or the owner's
       name in the dialogue, since neither was confirmed from a real
       source, only guessed from the email handle, per Milan's standing
       "no unverified claims" rule. No logo file, so shipped with the
       engine's built-in letter-badge fallback (CONFIG.brand.initial,
       empty logoSrc), same as Kozák tetőfedő mester, rather than waiting
       or inventing a mark. Solo operator (personal gmail, one phone
       number), so the agent speaks first person singular throughout.
       Eighth windscreen demo in the gallery. Needed a genuinely different
       angle after Kecskemét (formula pricing), Dombóvár (30 min, free
       callout in a fixed area, lifetime warranty), Dunaújváros (star
       crack, ~30 years, fixed Tesco spot), Győr (headlight polish led),
       Debrecen (casco swap) and Centrum Debrecen (aftermarket self-pay
       swap). This one leads with going to the CUSTOMER wherever they
       actually are, home or workplace, anywhere in Szombathely, rather
       than a fixed meeting spot, and charges an explicit kiszállási díj
       for that flexibility instead of Dombóvár's free-callout model,
       which is a real and different value proposition, not a reskin.
       THEME is a fresh violet, unused anywhere else in the gallery so far
       (the other blues, reds, ambers, greens, browns and teals are all
       taken), picked thematically since there was no logo to sample from.
       Dialogue written short, without em dashes, per Milan's standing
       preference.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>
