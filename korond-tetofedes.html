       guessing, same handling as Tetőfedés Szaki. Real detail from their
       own site: family business "generációk óta" (the '79 in the name
       implies founded 1979), tile/corrugated/trapéz/zsindely/pala roof
       coverings, 5 year full workmanship warranty, szakmai
       felelősségbiztosítás (professional liability insurance), written
       contract before work starts, structured handover documentation,
       free site visit with a detailed quote within 24 hours, serves
       "Magyarország egész területén" from across the Romanian border.
       Seventh roofing-family demo, so needed real separation again:
       Keszthelyi Tető (full pitched teardown), Tetőfedés Szaki (flat
       membrane), Kozák (overlay, no demolition), DECZKY (new timber
       structure, garden house), Hírös (storm damage), Chikán (custom new
       hip roof). This one leans on two real things none of the others
       use: trapézlemez as the covering material (a garage roof, not a
       house), and the professional-liability-insurance-plus-written-
       contract angle as the actual trust beat, given to a customer who
       says a previous contractor burned them with no paperwork. That is
       a genuinely different sales conversation from a technical one.
       Client placed in Berettyóújfalu, Hungary, since the company itself
       is based across the border in Korond, Romania but serves all of
       Hungary, the first demo in this gallery with that direction of
       cross-border service (other demos cross into Austria from Hungary,
       this one crosses into Hungary from Romania).
       Logo pulled straight from the file the user supplied: a dark
       charcoal-navy house icon with a vivid orange roof line, "KOROND" in
       charcoal and "TETŐFEDÉS" in orange, sampled by pixel (orange
       #ff6106, charcoal-navy #2d2f3b). No other roofing demo in the
       gallery uses this vivid true-orange on a charcoal-navy base.
       Family Bt. with generational staff, so the agent speaks first
       person plural throughout (fedjük, vállaljuk).
       Dialogue written short, without em dashes, per Milan's standing
       preference.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
