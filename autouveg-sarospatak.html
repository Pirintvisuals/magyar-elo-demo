  <!-- Client sample. Autóüveg Sárospatak, Nagy Lajos utca 2., Sárospatak.
       Phone +36 30 913 7927, email patakimoso@gmail.com. No usable About
       text on FB (name/location only), no reachable own site, so real
       detail came from an aggregated search result rather than a primary
       page: they do personal, small AND heavy vehicle glass, and they
       handle casco arrangements. Same treatment as Dunaújváros, built off
       search results rather than a live site.
       Ninth windscreen demo in the gallery, so the vehicle class had to be
       the differentiator, not just the story. Six demos already cover
       passenger cars (chip/crack repair three times over, headlight
       polish, casco swap, aftermarket self-pay swap), and Pelcz Autóüveg
       already covers the heavy end (a haulier's MAN TGL). This one uses
       the untouched middle segment implied by their own "kis- és
       tehergépjárművekhez is" service line: a small commercial van, a
       2019 Ford Transit run by a local courier, where the pain is a
       missed delivery route rather than a stalled building site. Kept it
       cash/company-invoice rather than a third casco storyline (Debrecen
       casco-funded, Pelcz casco-declined already cover that ground), and
       left ADAS and specific tenure claims out entirely since neither was
       confirmed from a real source.
       Logo is a white circular badge, blue windscreen-and-car icon plus a
       near-black/grey two-line wordmark, sampled by pixel (icon blue
       #0081c9, wordmark near-black #0d0d0d, subtitle grey #7b7b79). That
       blue is close to Autóüveg Debrecen's #008dd2 and Autóüveg Centrum
       Debrecen's #01a0e2, both already on cool blue-tinted navy bases, so
       a third demo built the same way would read as a reskin. THEME shifts
       the accent toward a cooler cyan-teal reading and sits it on a warm
       neutral charcoal-black base instead of navy, so it stays true to the
       logo's blue without cloning either Debrecen demo's palette.
       Branded company name, not a personal one, and no solo-operator
       evidence, so the agent speaks first person plural throughout
       (cserélünk, vállaljuk), same register as the two Debrecen demos.
       Dialogue written short, without em dashes, per Milan's standing
       preference.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>
