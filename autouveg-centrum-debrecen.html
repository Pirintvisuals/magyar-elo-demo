<!DOCTYPE html>

<head>

  <title>Instant Quote Demo</title>
  <!-- Client sample. Autóüveg Centrum Debrecen. Real site copy
       (autouvegcentrumdebrecen.hu): 4031 Debrecen, István út 149, contact
       Kiss Gábor, real published chip-repair starting price "már 8000
       forinttól", OEM vs "utángyártott" (aftermarket) glass choice for
       replacements, comprehensive casco handling, same-day/next-day
       appointments, free parking and a comfortable waiting area,
       professional vacuuming after replacement, 1-year leak warranty.
       Third windscreen demo in the gallery and the second one actually
       IN Debrecen (after Autóüveg Debrecen Kft), so it needed real
       differentiation, not just a reskin. That demo's whole angle is full
       casco claim administration and ADAS camera recalibration on a modern
       car, quoting the customer's out-of-pocket deductible rather than the
       full job cost. This one deliberately goes the other way: a customer
       who HAS casco but chooses not to claim it (a genuine, common
       consideration, filing a small glass claim can affect next year's
       bonus-malus rating), paying out of pocket instead, which makes the
       real OEM-vs-aftermarket glass price tradeoff the actual decision
       point, something the other Debrecen demo never touches since casco
       there pays for OEM-equivalent replacement regardless of cost. Also
       used an older car with no ADAS camera on purpose so this demo
       doesn't repeat that beat, and leaned on the real comfort details
       (free parking, waiting area, vacuuming, 1-year leak warranty)
       instead.
       Color note: the logo's blue (#01a0e2) sampled almost identically to
       Fintor's (#01a5ec) and closely to Autóüveg Debrecen's (#008dd2),
       three vivid-blue Hungarian trade logos landing in nearly the same
       hue. Rather than force a different color that wouldn't match the
       real logo, THEME differentiates through the surrounding palette: a
       deep navy-black base (not Fintor's flat matte black, not Autóüveg
       Debrecen's neutral charcoal grey) so the blue reads as a glowing
       accent against a "night sky" rather than sitting on flat black or
       grey. Still a real hue collision worth knowing about if the gallery
       index is ever shown side by side.
       Dialogue written short, without em dashes, per Milan's standing
       preference.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>
<body>
<div class="page-center" id="hero"></div>
