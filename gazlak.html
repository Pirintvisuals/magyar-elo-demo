       two specialties: víz-, gáz-, központi fűtés szerelés AND gépi
       földmunka (mechanical earthworks) — an unusual, genuinely
       complementary combo (most plumbing/heating firms don't also run
       excavation equipment).
       Angle: the ONE scenario that needs both specialties at once — full
       utility connection (víz/gáz/csatorna bekötés) for a new-build house,
       trenching from the plot boundary to the house. No other demo in the
       gallery covers new-connection/site-utility work (Aqua System did a
       boiler swap, Fintor a drain call-out, Szakszig wall injection) — this
       is the first "before the house even exists yet" scenario.
       Logo: `gazlak-logo.jpg` is NOT a graphic mark — it's an actual job-site
       photo of their excavator levelling a plot (yellow JCB-style loader,
       muddy ground, mobile homes in the background). User explicitly chose
       to use this real work photo as-is in the logo slot rather than source a
       proper logo graphic. object-fit:contain keeps it letterboxed/undistorted
       in the square slot. THEME accent (#ebb402) is the excavator's own
       yellow, sampled by pixel — thematically fitting given "gépi földmunka"
       is literally the excavator's job.
       Data-only file: the engine + styles live in /quote-agent.js + /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>
