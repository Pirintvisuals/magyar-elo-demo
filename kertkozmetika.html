       their own "több mint 15 éves tapasztalat" claim almost exactly —
       210+ elkészült kert, services kerttervezés / kertépítés (tereprendezés,
       burkolás, tóépítés, öntözőrendszer, sziklakert, gyepesítés, kerítés) /
       kertfenntartás (metszés, gyepszellőztetés, fűnyírás, tóápolás,
       sövénynyírás, avargyűjtés). Real published per-m² price bands pulled
       straight from their árak page and used to build this estimate's line
       items (gyepesítés 4 500–6 300 Ft/m², burkolás 25 000–33 000 Ft/m²,
       automata öntözés 2 500–4 000 Ft/m²) — first demo in the gallery where
       the source site publishes real rates, so the numbers are grounded in
       their own pricing rather than estimated from scratch.
       First LANDSCAPING demo in the gallery — every prior client is a
       construction/plumbing/roofing/HVAC trade, so this is a genuinely new
       vertical, not just a new job shape. Scenario: a brand-new-build house
       with a bare, rubble-strewn 220 m² plot — full from-scratch garden
       (grading, rolled sod over seed for fast usability, a paved patio,
       automatic irrigation, a low hedge) rather than a maintenance visit,
       to show off kertépítés rather than kertfenntartás.
       Logo `kertkozmetika-logo.png` — dark forest-green circular badge with
       a cream inner ring, crossed shears/rake mark, olive sprigs; sampled by
       pixel (green #1d3c34, cream #e2deba). THEME is a fresh forest-green +
       cream palette — distinct from Házrehab's yellower olive.
       Data-only file: the engine + styles live in /quote-agent.js + /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
