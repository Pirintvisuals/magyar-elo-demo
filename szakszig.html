       insulation, foundation/basement/pool waterproofing, RETROFIT wall

       the Hungarian insulators/roofers/tinsmiths association.
       Angle: unlike the other three demos (extension, panel-apartment reno,
       drain call-out), this company's rarest, most technical specialty is
       injektálásos utólagos falszigetelés (retrofit rising-damp wall injection)
       — a classic old-Hungarian-house problem (salétromos, nedves fal) that
       most general contractors don't actually do, so the scenario leans into
       explaining HOW the injection technology works (no digging/demolition,
       chemical damp-proof course drilled into the wall) as the "we actually
       know this" beat, plus a written-warranty/invoice trust beat.
       Logo `szakszig-logo.png` — plain black geometric mark on white, no
       colour to sample, so the accent was chosen thematically (blue = water)
       rather than pixel-sampled.
       Data-only file: the engine + styles live in /quote-agent.js + /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
