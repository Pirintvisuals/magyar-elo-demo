       tagline about investing in the car's longevity, value and driving
       experience, "diszkrécióval, precizitással, kivételes minőséggel".
       Real detail pulled from their own site: independent detailing
       studio, founded 2020, philosophy "Nem tömegszolgáltatás. Nem gyors
       mosás. Precizitás, technológia és szakértelem." and "A Különbség a
       Részletekben Rejlik", team led by detailer Aranyi Lajos, limited
       daily capacity for precision work, documented process with
       photo/protocol per car, personal quality check on every vehicle,
       7-day satisfaction guarantee, 10% loyalty discount for returning
       customers. Real published prices used for the quote: korrekciós
       polírozás "130,000 Ft-tól", kerámia bevonat 20,000-30,000 Ft,
       ablak kerámia 30,000 Ft, felni polírozás "15,000 Ft-tól".
       Fourth car-detailing demo in the gallery. Csernyik (Nyíregyháza)
       already covers correction polish plus Gtechniq ceramic, so this
       one had to earn its place on more than "another correction job":
       it leans on Golden Garage's own boutique positioning (limited
       capacity, photo-documented process, discretion, a named lead
       detailer) and uses their real four-figure price list for a
       full premium package (paint correction, paint ceramic, glass
       ceramic and wheel polish together), a bigger and more complete
       job than any other detailing demo in the gallery, consistent with
       their own "not mass service" premium framing.

       mark with a gold swoosh, "GOLDEN GARAGE" wordmark, sampled by
       pixel (muted metallic gold #a68957). Matt-Rex already pairs black
       with a similar soft champagne gold in this gallery, so THEME uses
       a warmer near-black base plus a brighter, more saturated true-gold
       accent instead of Matt-Rex's softer antique tone, keeping the two
       readable as different demos.
       Team led by a named detailer, not solo, so the agent speaks first
       person plural throughout (dolgozunk, dokumentáljuk).
       Dialogue written short, without em dashes, per Milan's standing
       preference.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
