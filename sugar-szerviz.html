<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>Instant Quote Demo</title>
  <!-- Client sample. Sugár Szerviz. Miskolc (Soltész Nagy Kálmán u. 65),
       serving all of Borsod-Abaúj-Zemplén county. Real site copy
       (sugarszerviz.hu): brand-independent household appliance repair,
       home-visit model across the county plus a workshop drop-off for
       smaller items (vacuum cleaners, coffee makers), real partner brands
       (Electrolux, Siemens, Gorenje, Neff, Bosch, Hisense, AEG, Zanussi),
       and a genuine trust detail used as-is in the dialogue: if the
       appliance turns out unrepairable on inspection, they do not charge a
       second callout fee, only the original callout stands. Repairs are
       attempted without parts first where possible. Typical turnaround is
       "within days" per their own site, used for timingShort.
       First APPLIANCE REPAIR demo in the gallery, a new vertical distinct
       from every prior construction/plumbing/roofing/HVAC/landscaping/
       automotive client. Scenario: a Bosch washing machine that stopped
       draining mid-cycle with a loud noise beforehand, pointing at the
       drain pump rather than just a clogged filter, a realistic diagnostic
       call rather than a big planned project, closer in shape to Zaha
       Zaha's boiler repair than to any renovation demo, but for a
       different appliance and trade. Client placed in Kazincbarcika
       (~24 km from Miskolc, a real distance within the county) rather than
       same-town, since this business explicitly covers the whole county.
       Logo `sugar-szerviz-logo.jpg`. white background, mint green washing
       machine and toolbox illustration with a darker teal green wordmark,
       sampled by pixel (mint #a1dab7, teal green #358f76). THEME keeps the
       base neutral steel grey/charcoal rather than green throughout, using
       the sampled greens only for brand/bright/dot, so it reads as
       "workshop with a mint accent" rather than colliding with
       Kertkozmetika's all-forest-green palette which samples a similar hue.
       Dialogue written short and without em dashes throughout, matching
       Milan's standing preference from the Csernyik demo rewrite.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>
<body>
<div class="page-center" id="hero"></div>
