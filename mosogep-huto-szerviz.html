  <!-- Client sample. Mosógép és Hűtő szerviz, Szúrmai utca 1.,

       email kisszemiszerviz@gmail.com, FB facebook.com/mosogepszerviz
       (186 like). The cold-open wrongly guessed Budapest as the city, the
       prospect corrected it to Hajdú-Bihar; Milan then confirmed the exact
       town directly with the prospect (Hajdúszoboszló) rather than
       guessing further, same no-unverified-claims handling as Tetőfedés
       Szaki. Real detail from their own listing: brand-independent repair
       of mosógép, mosogatógép, hűtőgép, szárítógép, elektromos tűzhely
       and mikrohullámú sütő, guarantee on work and installed parts.
       Third appliance-repair demo in the gallery, so needed real
       separation from Csergő Szabolcs (fridge, thermostat) and Sugár
       Szerviz (washing machine, drain pump). This one uses their own
       listed dishwasher (mosogatógép) service, which neither of the other
       two covers: a leaking door seal plus a clogged drain filter, a
       different failure mode and a different appliance category
       entirely.
       No logo file was supplied and none was findable online (their FB
       page has no usable About text or logo image beyond the page name),
       so this ships with the engine's letter-badge fallback, same
       treatment as Kozák tetőfedő mester before its logo arrived. THEME
       is thematic, not sampled: a clean steel-blue/appliance palette,
       distinct from both Csergő Szabolcs and Sugár Szerviz's colour
       choices.
       Business-branded name, not a personal one, and no solo-operator
       evidence, so the agent speaks first person plural throughout
       (megjavítjuk, kimegyünk), same register as Sugár Szerviz.
       Dialogue written short, without em dashes, per Milan's standing
       preference.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
