       prices, not invented ones: Bronze/Silver/Platinum/Platinum+ wash

       kozmetika 49,990-69,990 Ft, kárpittisztítás 19,990-59,990 Ft,

       19,990 Ft, fényszóró polírozás nanobevonattal fixed at 9,990
       Ft/lámpa, szélvédőjavítás "9,990 Ft-tól". Own tagline "Szerezz bele
       újra az autódba!", 394 Google review "KIVÁLÓ" rating, kényelmes
       váró frissítőkkel, időpontfoglalásos rendszer, nyitva H-P 8-18,
       Szo 8-15.
       Second car-detailing demo in the gallery (after Csernyik
       Autókozmetika, Nyíregyháza, which leads with correction polírozás
       and Gtechniq ceramic coating). This one is deliberately different:
       it uses NIX's own REAL fixed-price add-ons (kemény wax 19,990 Ft,
       fényszóró polírozás 9,990 Ft/lámpa) plus a mid-band real exterior
       package price, rather than an invented total, since these are
       actual published numbers rather than estimates. Scenario is a
       routine seasonal refresh (wax protection before winter, headlight
       clarity), not a correction/ceramic job like Csernyik's, so the two
       demos read as genuinely different services, not a reskin.
       Logo pulled straight from their own site/FB: white background,
       charcoal "Auto" plus a sky-blue "NIX" wordmark with a car-swoosh
       cutting through the X, "Autókozmetika" in charcoal beneath, sampled
       by pixel (blue #3ba5df, charcoal-black #1a1a1a). Fintor already
       pairs black with a similar blue in this gallery, so THEME uses a
       neutral true-grey base instead of Fintor's blue-tinted near-black,
       keeping the real blue as the accent without reading as the same
       palette.
       Established business with 394 reviews and an appointment system
       (not a solo operator), so the agent speaks first person plural
       throughout (vállaljuk, foglalunk), same register as Csernyik.
       Dialogue written short, without em dashes, per Milan's standing
       preference.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
