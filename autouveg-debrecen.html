  <title>Instant Quote Demo</title>
  <!-- Client sample. Autóüveg Debrecen Kft. Real site copy
       (autouvegdebrecen.com): 4002 Debrecen, Jégvirág utca 38, operating
       since 1992, 30+ years experience, ISO 9001 certified, partner with
       14+ major Hungarian insurers (Allianz, K&H, UNIQA, etc), full casco
       claim administration handled for the customer, ADAS calibration
       after glass replacement, wiper blade replacement as a real add-on
       service, warranty on all work.
       Second windscreen demo in the gallery after Glass Mechanix Dombóvár,
       needed real differentiation, not just a reskin. That one is a solo
       operator doing a small 30-minute chip repair for 5-15k Ft paid
       out of pocket. This one is an established 30-year Kft whose real
       headline differentiator is "teljes körű casco kárügyintézés", they
       handle the entire insurance claim so the customer barely deals with
       the insurer, and the job itself is a FULL windshield REPLACEMENT
       (crack too long/positioned to repair) on a modern car with an ADAS
       lane-assist camera that legally needs recalibrating after the glass
       goes in, real technical detail specific to newer vehicles that the
       Dombóvár demo's simple chip-repair scenario never touches.
       Because casco covers most of the job, the estimate shown is
       deliberately the CUSTOMER'S OUT-OF-POCKET total (deductible plus any
       non-covered extras like wiper blades), not the full replacement
       value the insurer pays the shop directly, first demo in the gallery
       where the quoted number isn't the whole job cost. Framed explicitly
       as an indicative estimate pending the actual policy's terms, not a
       guarantee, since exact casco deductibles vary by policy and I have
       no way to know this specific insurer's real terms.
       Logo `autouveg-debrecen-logo.png`. white background, a stylised car
       face with a blue windshield, azure blue "AUTÓÜVEG" wordmark, dark
       charcoal grey car outline and "DEBRECEN KFT." subtext, sampled by
       pixel (blue #008dd2, charcoal #434242). THEME pairs charcoal grey
       rather than pure black with the sampled azure, a more corporate,
       established read than Fintor's near-neon cyan-on-black urgent-callout
       feel or Aqua System's lighter grey-blue.
       Company, not solo, so the agent speaks in first person plural
       throughout ("nálunk", "intézzük"), unlike the two solo-operator
       demos (Csergő Szabolcs, Glass Mechanix Dombóvár).
       Dialogue written short, without em dashes, per Milan's standing
       preference.
       Data-only file. the engine and styles live in /quote-agent.js and /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>
