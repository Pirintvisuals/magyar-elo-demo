       this is the closest analogue to the original UK "Apex Roofing"
       template, localized).
       Angle: old asbestos-cement (eternit) roof on a family house, full
       replacement to cserép (tile), with the roof-truss/timber condition as
       an unknown to be confirmed once the eternit comes off (classic
       Hungarian old-house scenario — eternit often contains asbestos and
       needs careful, proper removal) — plus new guttering/flashing since all
       three of their stated services (structure/covering/flashing) are used
       in one job.
       Logo `keszthelyi-teto-logo.jpg` — charcoal bg with an architectural
       blueprint sketch behind a bronze roof-truss + house icon, sampled by
       pixel (bronze #b78644). Kept bg/dark/mid more neutral grey-charcoal
       (rather than warm brown) so the palette doesn't read too close to
       Eger Mester's or Gáz-Lak Mester's warm brown/gold themes.
       Data-only file: the engine + styles live in /quote-agent.js + /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
